name: CI

# Quality gate: install the workspaces, then run lint and the test placeholder
# on every pull request and on pushes to the default branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Matches the repo pin (.nvmrc lts/iron -> Node 20; engines >=20.11.0).
          node-version: "20"
          cache: npm

      - name: Install workspaces
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
